name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund

      - name: Verify workspace
        run: npm run ci

      - name: Generate CycloneDX SBOM
        if: success()
        run: |
          mkdir -p .evidence
          npm sbom --sbom-format cyclonedx > .evidence/sbom.cdx.json

      - name: Generate evidence manifest
        if: always()
        env:
          EVIDENCE_RESULT: ${{ job.status }}
        run: npm run evidence:generate

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
