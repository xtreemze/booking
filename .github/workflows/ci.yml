name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh migration lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/astro-monorepo'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit migration lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/astro-monorepo'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Verify workspace
        run: npm run ci

      - name: Generate CycloneDX SBOM
        if: success()
        run: |
          mkdir -p .evidence
          npm sbom --sbom-format cyclonedx > .evidence/sbom.cdx.json

      - name: Generate evidence manifest
        if: always()
        env:
          EVIDENCE_RESULT: ${{ job.status }}
        run: npm run evidence:generate

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh migration lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/astro-monorepo'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
